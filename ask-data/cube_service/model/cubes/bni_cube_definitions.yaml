cubes:
  - name: cai_customers
    sql_table: test.cai_customers
    description: Contains core customer demographic profiles.
    joins: []
    measures:
      - name: count
        type: count
        description: Total record count for cai_customers.
    dimensions:
      - name: customer_id
        sql: customer_id
        type: number
        description: Unique internal identity tracking number and primary key for each customer.
        primary_key: true
      - name: first_name
        sql: first_name
        type: string
        description: "The customer's first name."
      - name: last_name
        sql: last_name
        type: string
        description: "The customer's last name or surname."
      - name: email
        sql: email
        type: string
        description: The electronic email address of the account holder.
      - name: birth_date
        sql: birth_date
        type: time
        description: Date of birth. Crucial for calculating age or identifying upcoming birthdays.
      - name: bank_name
        sql: bank_name
        type: string
        description: "The banking institution name (e.g., 'ABC', 'BNI'). Filter by this when queries specify a particular bank's customers."
      - name: join_date
        sql: join_date
        type: time
        description: The exact date the customer first registered an account with the bank.
  - name: cai_savings
    sql_table: test.cai_savings
    description: "Liquid savings account data including current balances and interest rates. Status values are 'ACTIVE' or 'DORMANT'."
    joins:
      - name: cai_customers
        sql: "{CUBE}.customer_id = {cai_customers.customer_id}"
        relationship: belongs_to
    measures:
      - name: count
        type: count
        description: Total record count for cai_savings.
      - name: sum_balance
        sql: balance
        type: sum
        description: Calculates SUM of balance.
      - name: avg_balance
        sql: balance
        type: avg
        description: Calculates AVG of balance.
      - name: min_balance
        sql: balance
        type: min
        description: Calculates MIN of balance.
      - name: max_balance
        sql: balance
        type: max
        description: Calculates MAX of balance.
      - name: avg_interest_rate
        sql: interest_rate
        type: avg
        description: Calculates AVG of interest_rate.
      - name: min_interest_rate
        sql: interest_rate
        type: min
        description: Calculates MIN of interest_rate.
      - name: max_interest_rate
        sql: interest_rate
        type: max
        description: Calculates MAX of interest_rate.
    dimensions:
      - name: savings_id
        sql: savings_id
        type: number
        description: Unique identity primary key for the savings record.
        primary_key: true
      - name: customer_id
        sql: customer_id
        type: number
        description: Foreign key linking this account back to cai_customers.customer_id.
      - name: account_number
        sql: account_number
        type: string
        description: The unique public-facing alphanumeric bank account identifier number.
      - name: balance
        sql: balance
        type: number
        description: "Current liquid money available. Use this for 'total savings' or 'wealthiest customers' metrics."
      - name: interest_rate
        sql: interest_rate
        type: number
        description: The annual percentage yield interest tracking rate assigned to this savings account.
      - name: status
        sql: status
        type: string
        description: "Account state. Expected values are 'ACTIVE' or 'DORMANT'. Expected values: ACTIVE, DORMANT."
  - name: cai_deposits
    sql_table: test.cai_deposits
    description: Time deposits / fixed-term investment accounts with specific lock-in periods.
    joins:
      - name: cai_customers
        sql: "{CUBE}.customer_id = {cai_customers.customer_id}"
        relationship: belongs_to
    measures:
      - name: count
        type: count
        description: Total record count for cai_deposits.
      - name: sum_principal_amount
        sql: principal_amount
        type: sum
        description: Calculates SUM of principal_amount.
      - name: avg_principal_amount
        sql: principal_amount
        type: avg
        description: Calculates AVG of principal_amount.
      - name: min_principal_amount
        sql: principal_amount
        type: min
        description: Calculates MIN of principal_amount.
      - name: max_principal_amount
        sql: principal_amount
        type: max
        description: Calculates MAX of principal_amount.
      - name: avg_interest_rate
        sql: interest_rate
        type: avg
        description: Calculates AVG of interest_rate.
      - name: min_interest_rate
        sql: interest_rate
        type: min
        description: Calculates MIN of interest_rate.
      - name: max_interest_rate
        sql: interest_rate
        type: max
        description: Calculates MAX of interest_rate.
    dimensions:
      - name: deposit_id
        sql: deposit_id
        type: number
        description: Unique primary key for the fixed deposit record.
        primary_key: true
      - name: customer_id
        sql: customer_id
        type: number
        description: Foreign key mapping back to cai_customers.customer_id.
      - name: account_number
        sql: account_number
        type: string
        description: The unique account number identifier for this deposit facility.
      - name: principal_amount
        sql: principal_amount
        type: number
        description: The initial locked investment asset amount.
      - name: maturity_date
        sql: maturity_date
        type: time
        description: "The date when the fixed deposit expires and pays out. Check this for 'approaching maturity' questions."
      - name: interest_rate
        sql: interest_rate
        type: number
        description: The fixed contract interest rate paid out at maturity.
      - name: status
        sql: status
        type: string
        description: "The current status state of the investment term (e.g., 'ACTIVE'). Expected values: ACTIVE, MATURED, CANCELLED."
  - name: cai_loans
    sql_table: test.cai_loans
    description: Credit facilities and borrowing data extended to customers.
    joins:
      - name: cai_customers
        sql: "{CUBE}.customer_id = {cai_customers.customer_id}"
        relationship: belongs_to
    measures:
      - name: count
        type: count
        description: Total record count for cai_loans.
      - name: sum_principal_amount
        sql: principal_amount
        type: sum
        description: Calculates SUM of principal_amount.
      - name: avg_principal_amount
        sql: principal_amount
        type: avg
        description: Calculates AVG of principal_amount.
      - name: min_principal_amount
        sql: principal_amount
        type: min
        description: Calculates MIN of principal_amount.
      - name: max_principal_amount
        sql: principal_amount
        type: max
        description: Calculates MAX of principal_amount.
      - name: sum_outstanding_balance
        sql: outstanding_balance
        type: sum
        description: Calculates SUM of outstanding_balance.
      - name: avg_outstanding_balance
        sql: outstanding_balance
        type: avg
        description: Calculates AVG of outstanding_balance.
      - name: min_outstanding_balance
        sql: outstanding_balance
        type: min
        description: Calculates MIN of outstanding_balance.
      - name: max_outstanding_balance
        sql: outstanding_balance
        type: max
        description: Calculates MAX of outstanding_balance.
    dimensions:
      - name: loan_id
        sql: loan_id
        type: number
        description: Unique identity primary key for the loan entry.
        primary_key: true
      - name: customer_id
        sql: customer_id
        type: number
        description: Foreign key mapping back to cai_customers.customer_id.
      - name: loan_type
        sql: loan_type
        type: string
        description: "Type of loan facility (e.g., 'Home', 'Auto', 'Personal'). Expected values: Home, Auto, Personal."
      - name: principal_amount
        sql: principal_amount
        type: number
        description: The original total borrowed credit capital sum.
      - name: outstanding_balance
        sql: outstanding_balance
        type: number
        description: The remaining debt balance amount the customer still owes the bank.
      - name: maturity_date
        sql: maturity_date
        type: time
        description: The final payoff deadline date for the loan obligation.
      - name: status
        sql: status
        type: string
        description: "Operational loan indicator flag status state (e.g., 'ACTIVE'). Expected values: ACTIVE, PAID_OFF, DEFAULTED."
  - name: cai_credit_cards
    sql_table: test.cai_credit_cards
    description: Credit card account statements, revolving limits, and balances extended to customers.
    joins:
      - name: cai_customers
        sql: "{CUBE}.customer_id = {cai_customers.customer_id}"
        relationship: belongs_to
    measures:
      - name: count
        type: count
        description: Total record count for cai_credit_cards.
      - name: sum_credit_limit
        sql: credit_limit
        type: sum
        description: Calculates SUM of credit_limit.
      - name: avg_credit_limit
        sql: credit_limit
        type: avg
        description: Calculates AVG of credit_limit.
      - name: sum_current_balance
        sql: current_balance
        type: sum
        description: Calculates SUM of current_balance.
      - name: avg_current_balance
        sql: current_balance
        type: avg
        description: Calculates AVG of current_balance.
      - name: min_current_balance
        sql: current_balance
        type: min
        description: Calculates MIN of current_balance.
      - name: max_current_balance
        sql: current_balance
        type: max
        description: Calculates MAX of current_balance.
    dimensions:
      - name: card_id
        sql: card_id
        type: number
        description: Unique primary key for the card instance.
        primary_key: true
      - name: customer_id
        sql: customer_id
        type: number
        description: Foreign key tracking customer ownership in cai_customers.customer_id.
      - name: card_number
        sql: card_number
        type: string
        description: The unique plastic card PAN number format identifier sequence.
      - name: credit_limit
        sql: credit_limit
        type: number
        description: The maximum revolving credit threshold limit extended to the customer.
      - name: current_balance
        sql: current_balance
        type: number
        description: The active amount spent and currently owed on the credit card balance.
      - name: expiry_date
        sql: expiry_date
        type: time
        description: The operational expiration timeline date of the card.
      - name: status
        sql: status
        type: string
        description: "Revolving line risk indicators. Expected values are 'ACTIVE' or 'WARNING'. Expected values: ACTIVE, WARNING, BLOCKED."
  - name: cai_transactions
    sql_table: test.cai_transactions
    description: Tracks all financial ledger postings, operational deposits, cash extractions, and adjustments across accounts.
    joins:
      - name: cai_savings
        sql: "{CUBE}.account_number = {cai_savings.account_number}"
        relationship: belongs_to
      - name: cai_deposits
        sql: "{CUBE}.account_number = {cai_deposits.account_number}"
        relationship: belongs_to
    measures:
      - name: count
        type: count
        description: Total record count for cai_transactions.
      - name: sum_amount
        sql: amount
        type: sum
        description: Calculates SUM of amount.
      - name: avg_amount
        sql: amount
        type: avg
        description: Calculates AVG of amount.
      - name: min_amount
        sql: amount
        type: min
        description: Calculates MIN of amount.
      - name: max_amount
        sql: amount
        type: max
        description: Calculates MAX of amount.
    dimensions:
      - name: transaction_id
        sql: transaction_id
        type: number
        description: Unique internal tracking sequential ledger primary key.
        primary_key: true
      - name: account_number
        sql: account_number
        type: string
        description: The account target number receiving or sending funds. Joins back to cai_savings or cai_deposits.
      - name: amount
        sql: amount
        type: number
        description: The absolute numerical money value of the execution.
      - name: transaction_type
        sql: transaction_type
        type: string
        description: "Accounting ledger category direction. Expected values are 'DEBIT' (withdrawals/charges) or 'CREDIT' (deposits/payroll). Expected values: DEBIT, CREDIT."
      - name: transaction_timestamp
        sql: transaction_timestamp
        type: time
        description: The complete system timestamp tracker of when the execution posted to the ledger.
      - name: description
        sql: description
        type: string
        description: "The descriptive transaction text annotation (e.g., 'ATM Withdrawal', 'Payroll Transfer')."
  - name: cai_branch_performance
    sql_table: test.cai_branch_performance
    description: Regional business analytics metrics and performance dashboards indicating growth metrics.
    joins: []
    measures:
      - name: count
        type: count
        description: Total record count for cai_branch_performance.
      - name: sum_total_active_customers
        sql: total_active_customers
        type: sum
        description: Calculates SUM of total_active_customers.
      - name: avg_total_active_customers
        sql: total_active_customers
        type: avg
        description: Calculates AVG of total_active_customers.
      - name: avg_monthly_target_achieved
        sql: monthly_target_achieved
        type: avg
        description: Calculates AVG of monthly_target_achieved.
      - name: min_monthly_target_achieved
        sql: monthly_target_achieved
        type: min
        description: Calculates MIN of monthly_target_achieved.
      - name: max_monthly_target_achieved
        sql: monthly_target_achieved
        type: max
        description: Calculates MAX of monthly_target_achieved.
    dimensions:
      - name: branch_id
        sql: branch_id
        type: number
        description: Unique branch identifier primary key.
        primary_key: true
      - name: branch_name
        sql: branch_name
        type: string
        description: The clean geographical or municipal name designation of the branch location.
      - name: region
        sql: region
        type: string
        description: "The broader provincial administrative territory area grouping (e.g., 'DKI Jakarta')."
      - name: total_active_customers
        sql: total_active_customers
        type: number
        description: Total client profile count actively assigned to this node.
      - name: monthly_target_achieved
        sql: monthly_target_achieved
        type: number
        description: Performance target milestone percentage index ranking tracker.