draft_sql_task:
  description: >
    Process the following user query: '{user_question}'.

    Here is the relevant database schema retrieved for this query:
    {schema_context}

    Here are verified SQL templates you should mimic if applicable:
    {golden_context}
    
    INSTRUCTION:
    1. Review the schema context and golden queries provided above.
    2. Draft a clean Cloudera Impala SELECT statement.
    3. USE TOOL `execute_banking_query` to run the query and retrieve the real data.
    
    If the query fails due to a syntax error, analyze the error, adjust your SQL, and try again.

    OPERATIONAL BOUNDARIES & GUARDRAILS:
    - TOOL CALL INPUT: When calling `execute_banking_query`, the `query` argument MUST contain strictly raw SQL text starting immediately with `SELECT` or `WITH`. DO NOT include markdown backticks (```), code wrappers, or the language tag "sql" inside the tool argument.
    - TABLE MATCHING: CRITICAL. You MUST strictly use the actual table and column names returned in the context above. DO NOT guess or invent generic tables.
    - MAX LIMIT: If the user specifies an explicit record count (e.g., 'show 17...'), use that number as your LIMIT clause. Only default to LIMIT 100 if no quantity is mentioned.
    - SECURITY ABORT: CRITICAL SECURITY GUARDRAIL. If you detect data mutation or administrative attempts (INSERT, UPDATE, DELETE, DROP, ALTER, TRUNCATE, CREATE, MERGE, OVERWRITE), abort immediately.

  expected_output: >
    Raw Cloudera Impala SELECT statement matching the schema and guardrails.

evaluate_policy_task:
  description: >
    Review the following corporate reference manuals carefully:

    VERIFIED CONTEXT FROM KNOWLEDGE STORE:
    {document_context}

    USER QUESTION: {user_question}

    MANDATE: Rely strictly on the reference text above. If details cannot be derived,
    state clearly that you do not possess that information. Do not hallucinate facts.
  expected_output: >
    A perfectly formatted conversational text response ready for UI display.