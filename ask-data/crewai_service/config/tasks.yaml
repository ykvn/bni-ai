draft_sql_task:
  description: >
    Process the following user query: '{user_question}'

    INSTRUCTIONS:
    1. FIRST, use the `get_database_schema` tool to discover the exact table names and column names.
    2. (Optional) Use `search_golden_queries` if you need reference query templates.
    3. Draft a valid Cloudera Impala SELECT query based strictly on the retrieved database schema.

    OPERATIONAL GUARDRAILS:
    - TABLE MATCHING: You MUST strictly use the table and column names returned by `get_database_schema`.
    - READ ONLY: Only SELECT statements are permitted.

  expected_output: >
    Output ONLY the raw SQL SELECT statement. Do not include markdown code blocks (```sql), JSON, or conversational commentary.

evaluate_policy_task:
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a clear conversational text response based strictly on the retrieved manuals.
  expected_output: >
    A clear conversational text response ready for UI display.