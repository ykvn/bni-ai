fetch_schema_task:
  agent: schema_analyst
  description: >
    Retrieve the live database schema for the user query: '{user_question}'
    INSTRUCTION: Execute the `get_database_schema` tool with the user question. Do not think, explain, or output text. Pass the exact tool output as your response.
  expected_output: "The exact, raw tool response string returned by `get_database_schema`."

draft_sql_task:
  agent: sql_developer
  description: >
    Process the user query: '{user_question}'

    DATABASE SCHEMA:
    {db_schema}

    PREVIOUS ERROR TO FIX (If Empty, ignore):
    {error_context}

    INSTRUCTIONS:
    Write a valid Cloudera Impala SELECT query based on the schema above.
    If PREVIOUS ERROR TO FIX contains an Impala error, correct your SQL syntax.
    - TABLE MATCHING: You MUST strictly use the actual table and column names provided.
    - READ ONLY: Only write SELECT statements.
  expected_output: "Output ONLY the raw Cloudera Impala SELECT statement."

execute_sql_task:
  agent: sql_executor
  description: >
    Execute the following Cloudera Impala SELECT query:
    {sql_query}

    INSTRUCTION:
    Call the `execute_banking_query` tool immediately, passing the exact SQL query string provided above. Do not think or explain.
  expected_output: "The exact raw JSON output or error string returned by the `execute_banking_query` tool."

mf_fetch_schema_task:
  agent: mf_schema_analyst
  description: >
    Find the relevant MetricFlow metrics, dimensions, and entities to answer this question: '{user_question}'
    
    INSTRUCTIONS:
    1. Call the `search_mf_catalog` tool with the user question.
    2. Confirm that the catalog items were retrieved successfully.
  expected_output: "A brief statement confirming that the relevant metrics and dimensions were retrieved."

mf_draft_payload_task:
  agent: mf_payload_developer
  description: >
    Draft a valid dbt MetricFlow JSON query payload for the user question: '{user_question}'

    AVAILABLE CATALOG METRICS AND DIMENSIONS:
    {db_schema}

    PREVIOUS ERROR (If any):
    {error_context}

    INSTRUCTIONS:
    1. EXACT CATALOG NAMES: Copy the exact metric and dimension names provided in the catalog.
    2. TIME GRANULARITY MATCHING: If filtering by time in 'where' using a modifier, include the exact same dimension in 'group_by'.
    3. QUOTED DATE VALUES: MetricFlow truncates time dimensions into timestamps. Wrap date values in single quotes.
  expected_output: "A structured JSON MetricFlow query payload."

mf_execute_task:
  agent: mf_executor
  description: >
    Compile the MetricFlow JSON payload into raw Impala SQL:
    {sql_query}

    INSTRUCTION:
    You MUST Call the `compile_mf_sql` tool immediately. Return that exact SQL string. Do not hallucinate or execute the query.
  expected_output: "The exact raw Impala SQL string returned by the `compile_mf_sql` tool."

evaluate_policy_task:
  agent: compliance_officer
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a conversational text response based ONLY on the retrieved manuals.
  expected_output: "A clear conversational text response ready for UI display."