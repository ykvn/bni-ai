fetch_schema_task:
  description: >
    /no_think
    Retrieve the live database schema for the user query: '{user_question}'
    
    INSTRUCTION:
    Execute the `get_database_schema` tool immediately with the user question. Do not think, explain, or output text. Pass the exact tool output as your response.
  expected_output: >
    The exact, raw tool response string returned by `get_database_schema`.

draft_sql_task:
  description: >
    Process the user query: '{user_question}'

    INSTRUCTIONS:
    Using strictly the database schema retrieved in `fetch_schema_task`, write a valid Cloudera Impala SELECT query.

    OPERATIONAL GUARDRAILS:
    - TABLE MATCHING: You MUST strictly use the actual table and column names provided in the retrieved schema context (e.g., `cai_savings`, `cai_transactions`). DO NOT invent generic table names like 'customers' or 'accounts'.
    - READ ONLY: Only write SELECT statements.
  expected_output: >
    Output ONLY the raw Cloudera Impala SELECT statement. Do not wrap it in markdown code blocks (```sql), do not use JSON, and do not include conversational commentary.

execute_sql_task:
  description: >
    /no_think
    Execute the Cloudera Impala SELECT query drafted in `draft_sql_task`.

    INSTRUCTION:
    Call the `execute_banking_query` tool immediately, passing the exact SQL query string generated in `draft_sql_task`. Do not think or explain.
  expected_output: >
    The exact raw JSON output returned by the `execute_banking_query` tool.

evaluate_policy_task:
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a conversational text response based ONLY on the retrieved manuals.
  expected_output: >
    A clear conversational text response ready for UI display.