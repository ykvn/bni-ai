draft_sql_task:
  description: >
    Process the following user query: '{user_question}'

    INSTRUCTIONS:
    1. FIRST, use `get_database_schema` to find the correct table names and columns.
    2. (Optional) Use `search_golden_queries` to reference complex SQL templates.
    3. Draft your Cloudera Impala SELECT statement.
    4. Use `execute_banking_query` to run it. If it fails due to a syntax error, fix the SQL and execute it again.

    OPERATIONAL BOUNDARIES & GUARDRAILS:
    - TABLE MATCHING: CRITICAL. You MUST strictly use the actual table and column names returned by your schema tool.
    - READ ONLY: You are a read-only analyst. You must only ever write SELECT statements.

  expected_output: >
    Output ONLY a raw JSON object matching this exact structure. Do not include markdown or commentary:
    {
      "predicted_sql": "SELECT ...",
      "data": [{"column1": "value1"}, {"column1": "value2"}]
    }

evaluate_policy_task:
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a conversational text response based ONLY on the retrieved manuals.
  expected_output: >
    A clear conversational text response ready for UI display.