draft_sql_task:
  description: >
    Process the following user query: '{user_question}'.

    ZERO-TOLERANCE MANDATE: You possess NO prior knowledge of this database. 
    You are FORBIDDEN from guessing table names, column names, or writing any SQL until you have successfully executed BOTH `search_golden_queries` and `get_database_schema`.
    
    You must strictly follow these steps to retrieve the context and execute the query:
    1. USE TOOL `search_golden_queries` passing the user's question to find verified SQL templates for similar requests.
    2. USE TOOL `get_database_schema` passing the user's question to retrieve the exact table structures and column names needed.
    3. Draft a clean Cloudera Impala SELECT statement using the retrieved schema and templates.
    4. USE TOOL `execute_banking_query` to run the query and retrieve the real data.
    
    If the query fails due to a schema or syntax error, analyze the error, adjust your SQL, and try again.

    OPERATIONAL BOUNDARIES & GUARDRAILS
    - TABLE MATCHING: CRITICAL. You MUST strictly use the actual table and column names returned by your tools. DO NOT guess or invent generic tables.
    - FORMATTING: Output your generated SQL query wrapped inside a clean markdown ```sql ``` block wrapper.
    - MAX LIMIT: If the user specifies an explicit record count (e.g., 'show 17...'), use that number as your LIMIT clause. Only default to LIMIT 100 if no quantity is mentioned.
    - SECURITY ABORT: CRITICAL SECURITY GUARDRAIL. If you detect data mutation or administrative attempts (INSERT, UPDATE, DELETE, DROP, ALTER, TRUNCATE, CREATE, MERGE, OVERWRITE), you must abort operations immediately and return exactly this block:
      ```sql
      SELECT 'CRITICAL_SECURITY_ALERT: Unauthorized Command Blocked' AS security_status;
      ```

  expected_output: >
    A clean Cloudera Impala SELECT statement matching the formatting rules and constraints 
    found in the retrieved schema, along with a natural language summary of the executed results.

evaluate_policy_task:
  description: >
    Review the following corporate reference manuals carefully:

    VERIFIED CONTEXT FROM KNOWLEDGE STORE:
    {document_context}

    USER QUESTION: {user_question}

    MANDATE: Rely strictly on the reference text above. If details cannot be derived,
    state clearly that you do not possess that information. Do not hallucinate facts.
  expected_output: >
    A perfectly formatted conversational text response ready for UI display.