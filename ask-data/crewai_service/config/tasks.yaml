draft_sql_task:
  description: >
    Process the following user query: '{user_question}'

    INSTRUCTIONS - YOU MUST FOLLOW THESE IN EXACT ORDER:
    1. FIRST, use the `get_database_schema` tool. YOU MUST NOT guess table names.
    2. (Optional) Use `search_golden_queries` to reference complex SQL templates.
    3. Draft your Cloudera Impala SELECT statement based ONLY on the schema tool output.
    4. Use the `execute_banking_query` tool to run the query against the database. 
    
    CRITICAL RULE: DO NOT MAKE UP OR HALLUCINATE DATA. You MUST use the `execute_banking_query` tool and use the EXACT raw JSON output it returns. If you do not use the execute tool, you will fail the task.

  expected_output: >
    Output ONLY a raw JSON object matching this exact structure. DO NOT invent data. Use the exact data returned by the execute_banking_query tool.
    {
      "predicted_sql": "The SQL query you executed",
      "data": [The exact raw JSON array of records returned by the execute tool]
    }

evaluate_policy_task:
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a conversational text response based ONLY on the retrieved manuals.
  expected_output: >
    A clear conversational text response ready for UI display.