fetch_schema_task:
  description: >
    Retrieve the live database schema for the user query: '{user_question}'
    
    INSTRUCTION:
    Execute the `get_database_schema` tool with the user question. Do not think, explain, or output text. Pass the exact tool output as your response.
  expected_output: >
    The exact, raw tool response string returned by `get_database_schema`.

draft_sql_task:
  description: >
    Process the user query: '{user_question}'

    DATABASE SCHEMA:
    {db_schema}

    PREVIOUS ERROR TO FIX (If Empty, ignore):
    {error_context}

    INSTRUCTIONS:
    Write a valid Cloudera Impala SELECT query based on the schema above.
    If PREVIOUS ERROR TO FIX contains an Impala error, correct your SQL syntax (e.g., use JOINs instead of subquery UNIONs).
    
    OPERATIONAL GUARDRAILS:
    - TABLE MATCHING: You MUST strictly use the actual table and column names provided in the retrieved schema context. DO NOT invent generic table names outside the retrieved schema context.
    - NO FAKE ALIASING (CRITICAL): If the user asks for a specific metric, concept, or column that DOES NOT explicitly exist in the provided schema, DO NOT use 'AS' to alias an unrelated column to pretend it exists.
    - READ ONLY: Only write SELECT statements.
  expected_output: >
    Output ONLY the raw Cloudera Impala SELECT statement. Do not wrap it in markdown code blocks (```sql), do not use JSON, and do not include conversational commentary.

execute_sql_task:
  description: >
    Execute the following Cloudera Impala SELECT query:
    {sql_query}

    INSTRUCTION:
    Call the `execute_banking_query` tool immediately, passing the exact SQL query string provided above. Do not think or explain.
  expected_output: >
    The exact raw JSON output or error string returned by the `execute_banking_query` tool.

mf_fetch_schema_task:
  description: >
    Find the relevant MetricFlow metrics, dimensions, and entities to answer this question: '{user_question}'
    
    INSTRUCTIONS:
    1. Call the `search_mf_catalog` tool with the user question.
    2. Confirm that the catalog items were retrieved successfully.
  expected_output: >
    A brief statement confirming that the relevant metrics and dimensions were retrieved.

mf_draft_payload_task:
  description: >
    Draft a DBT MetricFlow JSON query payload for the user question: '{user_question}'

    AVAILABLE CATALOG METRICS AND DIMENSIONS:
    {db_schema}

    PREVIOUS ERROR (If any):
    {error_context}

    INSTRUCTIONS:
    1. Copy the exact 'name' strings provided under 'matched_dimensions' in the catalog context (e.g., 'customer_id__bank_name').
    2. Do not alter, re-prefix, or shorten the dimension names.
    3. TIME/DATE FILTERING: MetricFlow's default time dimension is usually 'metric_time'. To filter by year (e.g., 2025), use the "where" field like this: "metric_time__year = 2025".
  expected_output: >
    A structured MetricFlowQueryPayload containing metrics, group_by, and optional where fields.

mf_execute_task:
  description: >
    Compile the MetricFlow JSON payload into raw Impala SQL:
    {sql_query}

    INSTRUCTION:
    You MUST Call the `compile_mf_sql` tool immediately. It will return a raw Impala SQL string.
    Return that exact SQL string. Do not hallucinate or execute the query.
  expected_output: >
    The exact raw Impala SQL string returned by the `compile_mf_sql` tool.

evaluate_policy_task:
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a conversational text response based ONLY on the retrieved manuals.
  expected_output: >
    A clear conversational text response ready for UI display.