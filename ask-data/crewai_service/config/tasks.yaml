fetch_schema_task:
  agent: schema_analyst
  description: >
    Retrieve the live database schema for the user query: '{user_question}'
    INSTRUCTION: Execute the `search_database_schema` tool with the user question. Do not think, explain, or output text. Pass the exact tool output as your response, INCLUDING when it returns the 'I am sorry, I don't have this information on my database.' refusal (empty schema). Never invent tables or columns.
  expected_output: "The exact, raw tool response string returned by `search_database_schema` (including the 'I am sorry, I don't have this information on my database.' refusal when no tables match)."

draft_sql_task:
  agent: sql_developer
  description: >
    Process the user query: '{user_question}'

    DATABASE SCHEMA & VERIFIED GOLDEN QUERIES:
    {db_schema}

    PREVIOUS ERROR TO FIX (If Empty, ignore):
    {error_context}

    INSTRUCTIONS:
    Write a valid Cloudera Impala SELECT query based on the schema above.
    If PREVIOUS ERROR TO FIX contains an Impala error, correct your SQL syntax.
    NO-MATCH HANDLING: If the DATABASE SCHEMA section is empty or contains the refusal 'I am sorry, I don't have this information on my database.', do NOT invent table or column names and do NOT write SQL. Output EXACTLY the refusal line: "I am sorry, I don't have this information on my database."
    
    - TABLE MATCHING: You MUST strictly use the actual table and column names provided.
    - READ ONLY: Only write SELECT statements.
    - NULL HANDLING: When calculating monetary balance, use NVL for any decimal column. For example NVL(<decimal_column>, 0)
    - LIMIT RESULTS: Always LIMIT results to 100 (LIMIT 100) by default, unless specified otherwise.
    
    CRITICAL LLM CONTEXT RULES:
    1. DEFAULT TIME AXIS & AVAILABILITY DATE:
       - WHERE FILTER: When filtering on date/time, you MUST prioritize and filter on the column tagged with '[LLM Context: DEFAULT_TIME_AXIS: True]' (e.g., `as_of_date`).
       - AVAILABILITY DATE FOR JOINED TABLES: If a table contains an `availability_date` attribute (e.g., `availability_date: "2026-08-20"`), you MUST use that resolved date value as a WHERE clause filter for that table's DEFAULT_TIME_AXIS column
    2. STATIC ENUMS: If you are filtering on a categorical column tagged with '[LLM Context: Mode: STATIC_ENUM]', you MUST use the exact values provided in the 'Value Mappings' array. Do not invent spellings.
    3. GOLDEN QUERIES (ADAPT & COMBINE PATTERNS):
       - Treat Golden Queries as syntax and business logic references (e.g., standard join paths, default status filters like `cust_status = 'AKTIF'`).
       - NEVER copy a Golden Query 100% verbatim when the user query asks for dynamic timeframes, aggregates, or custom filters.
       - PATTERN MERGING: Extract the core filter/join logic from the related Golden Query, then combine it with the explicit query parameters (e.g., merge `cust_status = 'AKTIF'` from Golden Query with `as_of_date = '2026-08-01'` and `SUM(amount)` from the user question).
  expected_output: "Output ONLY the raw Cloudera Impala SELECT statement, OR the refusal line 'I am sorry, I don't have this information on my database.' when the DATABASE SCHEMA section has no matching tables."

execute_sql_task:
  agent: sql_executor
  description: >
    Execute the following Cloudera Impala SELECT query:
    {sql_query}

    INSTRUCTION:
    Call the `execute_sql_query` tool immediately, passing the exact SQL query string provided above. Do not think or explain.
  expected_output: "The exact raw JSON output or error string returned by the `execute_sql_query` tool."

mf_fetch_schema_task:
  agent: mf_schema_analyst
  description: >
    Find the relevant MetricFlow metrics, dimensions, and entities to answer this question: '{user_question}'
    
    INSTRUCTION: Execute the `search_mf_catalog` tool with the user question. Do not think, explain, or output text. Pass the exact tool output as your response, INCLUDING when it returns the 'I am sorry, I don't have this information on my database.' refusal (no matching metrics/dimensions/entities).
  expected_output: "The exact, raw tool response string returned by `search_mf_catalog` (including the 'I am sorry, I don't have this information on my database.' refusal when no matching metrics/dimensions/entities are found)."

mf_draft_payload_task:
  agent: mf_payload_developer
  description: >
    Draft a valid dbt MetricFlow JSON query payload for the user question: '{user_question}'

    AVAILABLE CATALOG METRICS AND DIMENSIONS:
    {db_schema}

    PREVIOUS ERROR (If any):
    {error_context}

    JSON BLUEPRINT TEMPLATE:
    Construct a single valid JSON object adhering to this schema:
    {{
      "metrics": ["<metric_name>"],
      "group_by": ["<entity_or_dimension_name>"],
      "where": ["<dimension_with_suffix> = '<value>'"],
      "order_by": ["-<metric_name>"],
      "limit": 10
    }}

    CRITICAL INSTRUCTIONS:
    1. EXACT NAMES: Use exact 'name' strings from matched_metrics, matched_dimensions, and matched_entities.
    2. NO-MATCH HANDLING: If AVAILABLE CATALOG is empty or contains 'I am sorry, I don't have this information on my database.', output EXACTLY: "I am sorry, I don't have this information on my database."
    3. MANDATORY GROUP_BY FOR WHERE FILTERS: ANY dimension (categorical or time) placed in 'where' MUST ALSO be included in 'group_by' with its exact granularity suffix (e.g., if 'where' has "trxchannel_id__as_of_date__day = '2026-08-17'", 'group_by' MUST include "trxchannel_id__as_of_date__day").
    4. PRIMARY METRIC TIME FILTERS (FROM USER QUESTION): Apply the user's requested date/month/year to the primary metric's `default_time_dimension`:
       - Single Date ('17 Agustus 2026'): "<default_time_dimension>__day = '2026-08-17'"
       - Date Range: "<default_time_dimension>__day >= 'YYYY-MM-DD' AND <default_time_dimension>__day < 'YYYY-MM-DD'"
       - Monthly ('Agustus 2026'): "<default_time_dimension>__month = '2026-08-01'"
       - Yearly ('2026'): "<default_time_dimension>__year = '2026-01-01'"
    5. JOINED ENTITY AVAILABILITY DATES: If a matched dimension/entity belonging to a secondary joined table has an `availability_date` attribute (e.g. `availability_date: '2026-08-20'`), add a filter for THAT entity's time dimension (e.g. "customer_icons_cif_key__as_of_date__day = '2026-08-20'"), UNLESS the user question explicitly specifies a date for that entity.
    6. TOP N & RANKING QUERIES:
       - GLOBAL RANKING ("Top 10", "10 terbesar", "overall"):
         Group by target entity key, set 'order_by' with '-' prefix (e.g., ["-trxchannel_amount_sum_metric"]), and set 'limit' (e.g., 10).
       - GROUPED RANKING ("per branch", "setiap cabang"):
         Group by target entity AND category. Set 'order_by', 'partition_by' (e.g., ["trxchannel_id__trx_branch"]), 'window_type' (DENSE_RANK), and 'max_rank' (e.g., 3). DO NOT use 'limit'.
  expected_output: "A structured JSON MetricFlow query payload object, OR the refusal line 'I am sorry, I don't have this information on my database.' when the AVAILABLE CATALOG section has no matching metrics/dimensions."

mf_execute_task:
  agent: mf_executor
  description: >
    Compile the MetricFlow JSON payload into raw Impala SQL:
    {sql_query}

    INSTRUCTION:
    You MUST Call the `compile_mf_sql` tool immediately. Return that exact SQL string. Do not hallucinate or execute the query.
  expected_output: "The exact raw Impala SQL string returned by the `compile_mf_sql` tool."

evaluate_policy_task:
  agent: compliance_officer
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a conversational text response based ONLY on the retrieved manuals.
  expected_output: "A clear conversational text response ready for UI display."