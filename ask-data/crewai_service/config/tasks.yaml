draft_sql_task:
  description: >
    Process the following user query: '{user_question}'

    INSTRUCTIONS - STRICTLY SEQUENTIAL WORKFLOW:
    1. SCHEMA DISCOVERY: You MUST use the `get_database_schema` tool to find the correct table names and columns. Do not guess.
    2. QUERY DRAFTING: Draft your Cloudera Impala SELECT statement using ONLY the discovered tables and columns.
    3. QUERY EXECUTION: You MUST use the `execute_banking_query` tool to run your drafted SQL statement.
    4. ERROR HANDLING: If the tool returns an error, fix the SQL and execute it again until successful.
    5. FINAL PARSING: Once execution is successful, take the raw data returned by the tool and construct your final JSON output.

    CRITICAL GUARDRAIL: You are strictly forbidden from hallucinating or inventing data. The `"data"` array in your final output MUST contain the exact records returned by the `execute_banking_query` tool. Do not generate your final answer until the execution tool has returned a successful result.

  expected_output: >
    A valid JSON object matching this exact structure, containing the actual executed SQL and the real data returned by the tool. Do not use markdown code blocks (```json).
    {
      "predicted_sql": "The exact SQL you executed",
      "data": [ EXACT output from the execute_banking_query tool ]
    }

evaluate_policy_task:
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a conversational text response based ONLY on the retrieved manuals.
  expected_output: >
    A clear conversational text response ready for UI display.