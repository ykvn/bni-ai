fetch_schema_task:
  description: >
    /no_think
    Retrieve the live database schema for the user query: '{user_question}'
    
    INSTRUCTION:
    Execute the `get_database_schema` tool immediately with the user question. Do not think, explain, or output text. Pass the exact tool output as your response.
  expected_output: >
    The exact, raw tool response string returned by `get_database_schema`.

draft_payload_task:
  description: >
    Draft a MetricFlow JSON query payload for the user question: '{user_question}'

    AVAILABLE CATALOG METRICS AND DIMENSIONS:
    {db_schema}

    PREVIOUS ERROR (If any):
    {error_context}

    INSTRUCTIONS:
    1. Fill out "metrics", "group_by", and "where" based on the catalog provided above.
    2. CRITICAL RULE FOR JOINED DIMENSIONS:
       - When grouping metrics by a dimension from a joined table, prefix the dimension with the entity name connecting them.
       - Example: To group savings balance by bank_name (which joins via customer_id), use 'customer_id__bank_name', NOT 'bank__name'.
    3. CRITICAL RULE FOR TIME/DATES:
       - MetricFlow's default time dimension is usually 'metric_time'. 
       - To filter by year (e.g., 2025), use the "where" field like this: "metric_time__year = 2025".
  expected_output: >
    A structured MetricFlowQueryPayload containing metrics, group_by, and optional where fields.

execute_sql_task:
  description: >
    /no_think
    Execute the following Cloudera Impala SELECT query:
    {sql_query}

    INSTRUCTION:
    Call the `execute_banking_query` tool immediately, passing the exact SQL query string provided above. Do not think or explain.
  expected_output: >
    The exact raw JSON output or error string returned by the `execute_banking_query` tool.

mf_fetch_schema_task:
  description: >
    Find the relevant MetricFlow metrics and dimensions to answer this question: '{user_question}'
    Use the search_mf_catalog tool.
  expected_output: >
    A list of exact metric names and dimension names returned by the catalog search.

mf_draft_payload_task:
  description: >
    Draft a MetricFlow JSON query payload for the user question: '{user_question}'

    AVAILABLE CATALOG METRICS AND DIMENSIONS:
    {db_schema}

    PREVIOUS ERROR (If any):
    {error_context}

    INSTRUCTIONS:
    1. Fill out "metrics" and "group_by" based on the catalog provided above.
    2. CRITICAL RULE FOR JOINED DIMENSIONS:
       - When grouping metrics by a dimension from a joined table, prefix the dimension with the entity name connecting them.
       - Example: To group savings balance by bank_name (which joins via customer_id), use 'customer_id__bank_name', NOT 'bank__name'.
  expected_output: >
    A structured MetricFlowQueryPayload containing metrics and group_by arrays.

mf_execute_task:
  description: >
    Execute the MetricFlow API tool using this JSON payload:
    {sql_query}

    INSTRUCTION:
    Call the compile_mf_sql tool immediately.
  expected_output: >
    The exact execution output returned by the compile_mf_sql tool.

evaluate_policy_task:
  description: >
    Answer the following corporate policy question: '{user_question}'

    INSTRUCTIONS:
    1. Use the `search_policy_documents` tool to query the enterprise knowledge base.
    2. Formulate a conversational text response based ONLY on the retrieved manuals.
  expected_output: >
    A clear conversational text response ready for UI display.