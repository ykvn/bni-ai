        type: "VARCHAR(100)"
        description: "Nama city yang mengidentifikasi entitas tersebut secara deskriptif."
      - name: risksector_name
        type: "VARCHAR(100)"
        description: "Nama sektor ekonomi atau industri yang mencerminkan aktivitas utama bisnis pihak terkait."

