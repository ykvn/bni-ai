        description: "NPWP adalah nomor pokok wajib pajak bagi perorangan maupun badan usaha yang\ndikeluarkan oleh Kantor Pelayanan Pajak."
      - name: counterparty_id
        type: "INT"
        description: "Pengidentifikasi unik (ID) counterparty yang menjadi kunci referensi data."
      - name: counterparty_name
        type: "VARCHAR(100)"
        description: "a. Jika pihak lawan adalah perorangan, maka diisi dengan nama lengkap sesuai dengan dokumen identitas. Jika nama sesuai dokumen identitas mengandung gelar maka gelar tersebut harus dihilangkan dalam pengisian data.\nContoh penulisan nama lengkap perorangan yang benar adalah ARIF NOOR RACHMAN.\nContoh penulisan nama lengkap perorangan yang salah, a.l: H. ARIF NOOR RACHMAN (“H” adalah gelar keagamaan), ARIF N. R. (“N” dan “R” tidak boleh disingkat), ARIF NOOR RACHMAN, SE., MM. (“SE” dan “MM” adalah gelar pendidikan).\nb. Jika pihak lawan adalah non perorangan, maka diisi sesuai dengan yang tercantum dalam dokumen akta badan usaha. Adapun kaidah penulisannya adalah tidak perlu mencantumkan bentuk badan usaha, tidak disingkat, serta tidak ada tanda baca.\nContoh penulisan nama badan usaha (non perorangan) yang benar adalah MAJU MAKMUR SEJAHTERA.\nContoh penulisan nama badan (non perorangan) yang salah, a.l: PT MAJU MAKMUR SEJAHTERA, MAJU MAKMUR SEJAHTERA, PT, MAJU MKMR SJHTRA.\nc. Jika Bank diisi sesuai dengan yang tercantum pada daftar nama yang ada Bank Indonesia sesuai dengan Laporan Bank Umum Terintegrasi"
