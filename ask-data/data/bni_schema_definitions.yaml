        type: "varchar(100)"
        description: "Acquirer Mesin"
      - name: journal_no
        type: "varchar(50)"
        description: "No Jurnal Transaksi"
      - name: amount
        type: "decimal(22,2)"
        description: "Nilai Transaksi / Transaction Amount / Amount Transaksi"
      - name: channel
        type: "string"
        description: "Channel Transaksi [LLM Context: Mode: STATIC_ENUM | Value Mappings: [API - Transaksi API; ACQUIRING - Transaksi Acquiring; SPAN - Transaksi SPAN; WONDR (Synonyms: Wonder) - Transaksi via Wonder / WONDR; TELLER - Transaksi via Teller; SMS - Transaksi via SMS; OTHERS - Transaksi lainnya; BOP - Transaksi BOP; AUTODEBET - Transaksi via Autodebet; EDC_NON_BNI - Transaksi via EDC Non BNI (EDC Bank Lain); NEW_MOB - Transaksi New MOB; REMITTANCE - Transaksi Remittance; AGEN_TRX - Transaksi via Agen; BNIDIRECT - Transaksi via BNI Direct; NON API - Transaksi Non API; ATM - Transaksi via ATM]]"
      - name: trx_region
        type: "smallint"
        description: "Region Transaksi"
      - name: trx_branch
        type: "smallint"
        description: "Branch Pemroses Transaksi"
      - name: trx_sub_branch
        type: "smallint"
        description: "KCP Pemroses Transaksi"
      - name: chargeable
        type: "varchar(50)"
        description: "Flag Chargeble"
      - name: trx_code
        type: "varchar(50)"
        description: "Kode Transaksi"
      - name: trx_type
        type: "varchar(50)"
        description: "Tipe Transaksi"
      - name: trx_desc
        type: "varchar(50)"
        description: "Deskripsi Transaksi"
      - name: trx_group
        type: "varchar(50)"
        description: "Group Transaksi"
      - name: trx_category
        type: "varchar(50)"
        description: "Kategori Transaksi"
      - name: source_data
        type: "varchar(50)"
        description: "Source Data"
      - name: industri
        type: "varchar(50)"
        description: "Industri Pengirim"
      - name: target_cif
        type: "bigint"
        references: "dm_customer.customer_icons.cif_key"
        description: "CIF Penerima"
      - name: target_account_number
        type: "bigint"
        references: "dm_funding.funding.account_number; dm_lending.lending.account_number"
        description: "No Rek Penerima"
      - name: destination_bankname
        type: "varchar(50)"
        description: "Bank Penerima"
      - name: destination_name
        type: "varchar(50)"
        description: "Nama Penerima"
