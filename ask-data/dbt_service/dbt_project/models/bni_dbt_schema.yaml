  - name: pep_flag
    type: categorical
    expr: pep_flag
    description: Flag Politically Exposed Person (PEP) yang selanjutnya disingkat
      sebagai PEP adalah orang yang memiliki atau pernah memiliki kewenangan publik
      diantaranya adalah penyelenggara negara sebagaimana dimaksud dalam peraturan
      perundangundangan yang mengatur tentang penyelenggara negara, dan/atau orang
      yang tercatat atau pernah tercatat sebagai anggora partai politik yang memiliki
      pengaruh terhadap kebijakan dan operasional partai politik, baik yang berkewarganegaraan
      Indonesia maupun yang berkewarganegaraan asing.
