version: 2
models:
- name: metricflow_time_spine
  description: Required time spine for MetricFlow aggregations
  time_spine:
    standard_granularity_column: date_day
  columns:
  - name: date_day
    granularity: day
semantic_models:
- name: trxchannel
  model: ref('trxchannel')
  entities:
  - name: customer_icons_cif_key
    type: foreign
    expr: cif_key
  - name: funding_account_number
    type: foreign
    expr: account_number
  - name: lending_account_number
    type: foreign
    expr: account_number
  - name: target_cif_customer_icons
    type: foreign
    expr: target_cif
  - name: target_account_number_funding
    type: foreign
    expr: target_account_number
  - name: target_account_number_lending
    type: foreign
    expr: target_account_number
  - name: trxchannel_id
    type: primary
    expr: '1'
  dimensions:
  - name: as_of_date
    type: time
    expr: as_of_date
    description: Tanggal Data
    type_params:
      time_granularity: day
  - name: trx_datetime
    type: time
    expr: trx_datetime
    description: Waktu Transaksi
    type_params:
      time_granularity: day
  - name: issuer_bank_name
    type: categorical
    expr: issuer_bank_name
    description: Bank Pengirim
  - name: issuer_name
    type: categorical
    expr: issuer_name
    description: Nama Pengirim
  - name: open_region
    type: categorical
    expr: open_region
    description: Region Pembuka Rekening
  - name: open_branch
    type: categorical
    expr: open_branch
    description: Branch Pembuka Rekening
  - name: open_sub_branch
    type: categorical
    expr: open_sub_branch
    description: KCP Pembuka Rekening
  - name: atm_card_number
    type: categorical
    expr: atm_card_number
    description: Nomor Rekening ATM
  - name: terminal_id
    type: categorical
    expr: terminal_id
    description: ID Terminal
  - name: switcher_atm
    type: categorical
    expr: switcher_atm
    description: Switcher ATM
  - name: machine_acquirer
    type: categorical
    expr: machine_acquirer
    description: Acquirer Mesin
  - name: journal_no
    type: categorical
    expr: journal_no
    description: No Jurnal Transaksi
  - name: amount
    type: categorical
    expr: amount
    description: Nilai Transaksi
  - name: channel
    type: categorical
    expr: channel
    description: 'Channel Transaksi [LLM Context: Mode: STATIC_ENUM | Value Mappings:
      [API - Transaksi API; ACQUIRING - Transaksi Acquiring; SPAN - Transaksi SPAN;
      WONDR (Synonyms: Wonder) - Transaksi via Wonder / WONDR; TELLER - Transaksi
      via Teller; SMS - Transaksi via SMS; OTHERS - Transaksi lainnya; BOP - Transaksi
      BOP; AUTODEBET - Transaksi via Autodebet; EDC_NON_BNI - Transaksi via EDC Non
      BNI (EDC Bank Lain); NEW_MOB - Transaksi New MOB; REMITTANCE - Transaksi Remittance;
      AGEN_TRX - Transaksi via Agen; BNIDIRECT - Transaksi via BNI Direct; NON API
      - Transaksi Non API; ATM - Transaksi via ATM]]'
  - name: trx_region
    type: categorical
    expr: trx_region
    description: Region Transaksi
  - name: trx_branch
    type: categorical
    expr: trx_branch
    description: Branch Pemroses Transaksi
  - name: trx_sub_branch
    type: categorical
    expr: trx_sub_branch
    description: KCP Pemroses Transaksi
  - name: chargeable
    type: categorical
    expr: chargeable
    description: Flag Chargeble
  - name: trx_code
    type: categorical
    expr: trx_code
    description: Kode Transaksi
  - name: trx_type
    type: categorical
    expr: trx_type
    description: Tipe Transaksi
  - name: trx_desc
    type: categorical
    expr: trx_desc
    description: Deskripsi Transaksi
  - name: trx_group
    type: categorical
    expr: trx_group
    description: Group Transaksi
  - name: trx_category
    type: categorical
    expr: trx_category
    description: Kategori Transaksi
  - name: source_data
    type: categorical
    expr: source_data
    description: Source Data
  - name: industri
    type: categorical
    expr: industri
    description: Industri Pengirim
  - name: destination_bankname
    type: categorical
    expr: destination_bankname
    description: Bank Penerima
  - name: destination_name
    type: categorical
    expr: destination_name
    description: Nama Penerima
  - name: bsu_flag
    type: categorical
    expr: bsu_flag
    description: FLAG BSU
  - name: jenis_trx
    type: categorical
    expr: jenis_trx
    description: Jenis Transaksi
  - name: sub_jenis_trx
    type: categorical
    expr: sub_jenis_trx
    description: Sub Jenis Transaksi
  - name: trx_classification
    type: categorical
    expr: trx_classification
    description: Klasifikasi Transaksi
  - name: biller_target
    type: categorical
    expr: biller_target
    description: Target Biller
  - name: currency
    type: categorical
    expr: currency
    description: Mata Uang
  - name: amount_ori
    type: categorical
    expr: amount_ori
    description: Jumlah Asli (Sebelum Convert Ke IDR)
  measures:
  - name: trxchannel_journal_no_count
    expr: journal_no
    agg: count
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_sum
    expr: amount
    agg: sum
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_average
    expr: amount
    agg: average
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_min
    expr: amount
    agg: min
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_max
    expr: amount
    agg: max
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_ori_sum
    expr: amount_ori
    agg: sum
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_ori_average
    expr: amount_ori
    agg: average
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_ori_min
    expr: amount_ori
    agg: min
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_ori_max
    expr: amount_ori
    agg: max
    agg_time_dimension: as_of_date
