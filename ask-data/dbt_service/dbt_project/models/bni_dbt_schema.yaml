    type: foreign
    expr: target_account_number
  - name: trxchannel_id
    type: primary
    expr: '1'
  dimensions:
  - name: as_of_date
    type: time
    expr: as_of_date
    description: Tanggal Transaksi Data, digunakan untuk filter tanggal, bulan, tahun
    type_params:
      time_granularity: day
  - name: trx_datetime
    type: time
    expr: trx_datetime
    description: Waktu Transaksi
