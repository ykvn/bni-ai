  label: Cai_Savings Balance Sum
  description: Current liquid money available. Use this for 'total savings' or 'wealthiest
    customers' metrics.
  type: simple
  type_params:
    measure: cai_savings_balance_sum
- name: cai_savings_balance_average_metric
  label: Cai_Savings Balance Average
