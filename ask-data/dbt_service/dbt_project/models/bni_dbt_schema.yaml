    type: categorical
    expr: biller_target
    description: Target Biller
  - name: currency
    type: categorical
    expr: currency
    description: Mata Uang
  - name: amount_ori
    type: categorical
    expr: amount_ori
    description: Jumlah Asli (Sebelum Convert Ke IDR)
  measures:
  - name: trxchannel_journal_no_count
    expr: journal_no
    agg: count
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_sum
    expr: amount
    agg: sum
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_average
    expr: amount
    agg: average
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_min
    expr: amount
    agg: min
    agg_time_dimension: as_of_date
  - name: trxchannel_amount_max
