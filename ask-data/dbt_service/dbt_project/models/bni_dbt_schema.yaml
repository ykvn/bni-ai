    type: categorical
    expr: trx_code
    description: Kode Transaksi
  - name: trx_type
    type: categorical
    expr: trx_type
    description: Tipe Transaksi
  - name: trx_desc
    type: categorical
    expr: trx_desc
    description: Deskripsi Transaksi
  - name: trx_group
    type: categorical
    expr: trx_group
    description: Group Transaksi
  - name: trx_category
    type: categorical
    expr: trx_category
    description: Kategori Transaksi
  - name: source_data
    type: categorical
    expr: source_data
    description: Source Data
  - name: industri
    type: categorical
    expr: industri
    description: Industri Pengirim
  - name: destination_bankname
    type: categorical
    expr: destination_bankname
    description: Bank Penerima
  - name: destination_name
    type: categorical
    expr: destination_name
    description: Nama Penerima
  - name: bsu_flag
    type: categorical
    expr: bsu_flag
    description: FLAG BSU
