    expr: counterparty_type
    description: Jenis dari counterparty yang berisi Bank, Corporate, Individual,
      Governance, Private,  Others
  - name: is_resident
    type: categorical
    expr: is_resident
    description: Warga negara Peserta
  - name: mdm_id
    type: categorical
    expr: mdm_id
    description: Pengidentifikasi unik (ID) mdm yang menjadi kunci referensi data.
  - name: nationality
    type: categorical
    expr: nationality
    description: Kewarganegaraan pihak lawan perorangan sesuai dengan dokumen identitas.
      Dimensi Nomor Identitas ini hanya diisi jika Golongan Pihak Lawan adalah Perorangan.
  - name: countries_id
    type: categorical
    expr: countries_id
    description: Pengidentifikasi unik (ID) countries yang menjadi kunci referensi
      data.
  - name: as_of_date
    type: time
    expr: as_of_date
    description: Posisi periode dari data yang ditampilkan
    type_params:
      time_granularity: day
  - name: cities_id
    type: categorical
    expr: cities_id
    description: Pengidentifikasi unik (ID) cities yang menjadi kunci referensi data.
  - name: counterparty_status
    type: categorical
    expr: counterparty_status
    description: Status counterparty yakni antara lain Bank Luar Negeri, Counterparty
      DN Dalam Negeri, Counterparty DN luar negeri, Counterparty LN
  - name: cust_tax_id
    type: categorical
    expr: cust_tax_id
    description: 'NPWP adalah nomor pokok wajib pajak bagi perorangan maupun badan
      usaha yang

      dikeluarkan oleh Kantor Pelayanan Pajak.'
  - name: counterparty_id
    type: categorical
    expr: counterparty_id
    description: Pengidentifikasi unik (ID) counterparty yang menjadi kunci referensi
      data.
  - name: counterparty_name
    type: categorical
    expr: counterparty_name
    description: "a. Jika pihak lawan adalah perorangan, maka diisi dengan nama lengkap\
      \ sesuai dengan dokumen identitas. Jika nama sesuai dokumen identitas mengandung\
      \ gelar maka gelar tersebut harus dihilangkan dalam pengisian data.\nContoh\
      \ penulisan nama lengkap perorangan yang benar adalah ARIF NOOR RACHMAN.\nContoh\
      \ penulisan nama lengkap perorangan yang salah, a.l: H. ARIF NOOR RACHMAN (\u201C\
      H\u201D adalah gelar keagamaan), ARIF N. R. (\u201CN\u201D dan \u201CR\u201D\
      \ tidak boleh disingkat), ARIF NOOR RACHMAN, SE., MM. (\u201CSE\u201D dan \u201C\
      MM\u201D adalah gelar pendidikan).\nb. Jika pihak lawan adalah non perorangan,\
      \ maka diisi sesuai dengan yang tercantum dalam dokumen akta badan usaha. Adapun\
      \ kaidah penulisannya adalah tidak perlu mencantumkan bentuk badan usaha, tidak\
      \ disingkat, serta tidak ada tanda baca.\nContoh penulisan nama badan usaha\
      \ (non perorangan) yang benar adalah MAJU MAKMUR SEJAHTERA.\nContoh penulisan\
      \ nama badan (non perorangan) yang salah, a.l: PT MAJU MAKMUR SEJAHTERA, MAJU\
      \ MAKMUR SEJAHTERA, PT, MAJU MKMR SJHTRA.\nc. Jika Bank diisi sesuai dengan\
      \ yang tercantum pada daftar nama yang ada Bank Indonesia sesuai dengan Laporan\
      \ Bank Umum Terintegrasi"
  - name: city_name
    type: categorical
    expr: city_name
    description: Nama city yang mengidentifikasi entitas tersebut secara deskriptif.
  - name: risksector_name
    type: categorical
    expr: risksector_name
    description: Nama sektor ekonomi atau industri yang mencerminkan aktivitas utama
      bisnis pihak terkait.
  measures: []
