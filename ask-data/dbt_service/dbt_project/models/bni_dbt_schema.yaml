version: 2
semantic_models:
- name: metricflow_time_spine
  description: Required time spine for MetricFlow aggregations
  model: ref('metricflow_time_spine')
  entities:
  - name: date_id
    type: primary
    expr: date_day
  dimensions:
  - name: date_day
    type: time
    expr: date_day
    type_params:
      time_granularity: day
- name: customer_group
  model: ref('customer_group')
  entities: []
  dimensions:
  - name: nama_principal
    type: categorical
    expr: nama_principal
    description: Nama Utama
  - name: tiering
    type: categorical
    expr: tiering
    description: Tiering (Jenjang)
  - name: region_principal
    type: categorical
    expr: region_principal
    description: Wilayah Principal
  - name: nama_group_client_tiering
    type: categorical
    expr: nama_group_client_tiering
    description: Nama Tiering Klien Grup
  - name: periode
    type: time
    expr: periode
    description: Periode pelaporan data
    type_params:
      time_granularity: day
  - name: nama_subholding
    type: categorical
    expr: nama_subholding
    description: Nama Subholding
  - name: flagging_diamond
    type: categorical
    expr: flagging_diamond
    description: Flag Diamond
  measures: []
- name: customer_performance
  model: ref('customer_performance')
  entities:
  - name: mdm_id
    type: primary
    expr: mdm_id
  dimensions:
  - name: total_reksadana
    type: categorical
    expr: total_reksadana
    description: Total Reksadana
  - name: saldo_dspa
    type: categorical
    expr: saldo_dspa
    description: Saldo DSPA
