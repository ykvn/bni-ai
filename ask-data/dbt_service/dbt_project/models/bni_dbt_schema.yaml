- name: customer_beneficial_owner_individu
  model: ref('customer_beneficial_owner_individu')
  entities:
  - name: bo_id_number
    type: foreign
    expr: bo_id_number
  dimensions:
  - name: bo_id_type
    type: categorical
    expr: bo_id_type
    description: Pengidentifikasi unik (ID) bo jenis deskripsi yang menjadi kunci
      referensi data.
  - name: bo_fund
    type: categorical
    expr: bo_fund
    description: Atribut yang mencatat informasi bo dana dalam operasional perbankan.
  - name: bo_marital_status
    type: categorical
    expr: bo_marital_status
    description: Status bo status pernikahan yang menunjukkan kondisi atau tahapan
      terkini.
  - name: bo_fund_year_own
    type: categorical
    expr: bo_fund_year_own
    description: Atribut yang mencatat informasi bo dana tahun own dalam operasional
      perbankan.
  - name: as_of_date
    type: time
    expr: as_of_date
    description: Posisi periode dari data yang ditampilkan
    type_params:
      time_granularity: day
  - name: source
    type: categorical
    expr: source
    description: Identifikasi sumber asal data
  - name: bo_id_type_desc
    type: categorical
    expr: bo_id_type_desc
    description: Pengidentifikasi unik (ID) bo jenis deskripsi yang menjadi kunci
      referensi data.
  - name: dom_tax_ln_flag
    type: categorical
    expr: dom_tax_ln_flag
    description: Penanda/indikator bo dom tax ln yang menunjukkan kondisi, kategori,
      atau keikutsertaan tertentu.
  - name: bo_birth_date
    type: time
    expr: bo_birth_date
    description: Tanggal bo kelahiran yang mencatat kapan hal tersebut terjadi atau
      berlaku.
    type_params:
      time_granularity: day
  - name: seq_no
    type: categorical
    expr: seq_no
    description: Atribut yang mencatat informasi seq nomor dalam operasional perbankan.
  - name: bo_tax_id
    type: categorical
    expr: bo_tax_id
    description: Pengidentifikasi unik (ID) bo tax yang menjadi kunci referensi data.
  - name: bo_description
    type: categorical
    expr: bo_description
    description: Atribut yang mencatat informasi bo deskripsi dalam operasional perbankan.
  - name: bo_pep_flag
    type: categorical
