version: 2
models:
- name: metricflow_time_spine
  description: Required time spine for MetricFlow aggregations
  time_spine:
    standard_granularity_column: date_day
  columns:
  - name: date_day
    granularity: day
semantic_models:
- name: trxchannel
  model: ref('trxchannel')
