model_list:
  - model_name: os.environ/CML_MODEL_NAME      # Registers: Qwen/Qwen2.5-3B-Instruct
    litellm_params:
      model: os.environ/CML_MODEL_NAME
      custom_llm_provider: openai
      api_base: os.environ/QWEN_APP_URL
      api_key: os.environ/CDP_TOKEN
      ssl_verify: false
      request_timeout: 300    # 👈 Extends HTTP timeout to 5 minutes for CoT generation
      num_retries: 3         # 👈 Automatically retries on dropped TCP connections

router_settings:
  routing_strategy: simple-shuffle
  timeout: 300
  num_retries: 3