litellm_settings:
  drop_params: true

model_list:
  - model_name: os.environ/CML_MODEL_NAME
    litellm_params:
      model: os.environ/CML_MODEL_NAME
      custom_llm_provider: openai
      api_base: os.environ/QWEN_APP_URL
      api_key: os.environ/CDP_TOKEN
      ssl_verify: false
      request_timeout: 300
      num_retries: 3
      reasoning_effort: "none"
      extra_body:
        thinking:
          type: "disabled"

router_settings:
  routing_strategy: simple-shuffle
  timeout: 300
  num_retries: 3